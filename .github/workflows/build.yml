name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One run at a time per branch, in push order, so an older run can't publish over a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Screenshots, animation recordings and the launch checks take a few minutes, so they
      # only run when a push changes how the launcher looks (or on a manual run).
      - name: Check for visual changes
        id: visual
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          visual='^Sources/TenFoot/(LauncherView|StatusBar|Theme|Game)\.swift$'
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            run=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq "$visual"; then
            run=true
          else
            run=false
          fi
          echo "Visual change: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # The same certificate signs every build (once it's in the repo's secrets), so macOS
      # remembers TenFoot's Accessibility permission across updates.
      - name: Signing certificate
        env:
          CERT_P12: ${{ secrets.TENFOOT_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TENFOOT_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            # An ad-hoc build would make macOS forget TenFoot's Accessibility permission on update.
            if [ "$GITHUB_REF" = refs/heads/dev ]; then
              echo "::error::No signing certificate in secrets (TENFOOT_CERT_P12); dev builds must be signed"
              exit 1
            fi
            echo "::warning::No signing certificate in secrets; using an ad-hoc signature"
            exit 0
          fi
          # The certificate's files never outlive this step, whatever happens.
          trap 'rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"' EXIT
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # OpenSSL 3 packs .p12 files in a newer format that macOS's `security` can't read
          # ("MAC verification failed"), so repack it in the older one macOS understands.
          ossl="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$ossl" ] || ossl=openssl
          if ! "$ossl" pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nodes -out "$RUNNER_TEMP/cert.pem"; then
            rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
            echo "::error::Couldn't open TENFOOT_CERT_P12 with TENFOOT_CERT_PASSWORD; check the password secret matches the one used to make the .p12"
            exit 1
          fi
          "$ossl" pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -passout env:CERT_PASSWORD \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -out "$RUNNER_TEMP/cert.p12"
          rm "$RUNNER_TEMP/cert.pem"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # By its hash: a self-made certificate isn't trusted on the CI machine, so its name won't do.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/\)/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::The certificate in TENFOOT_CERT_P12 has no code signing identity"
            exit 1
          fi
          echo "Signing with $identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build-app.sh

      # The signing key is only needed for the build; nothing after it can use it.
      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: TenFoot-app
          path: build/TenFoot.zip

      # One fixed download link that always has the newest dev build:
      # https://github.com/<owner>/<repo>/releases/download/latest-dev/TenFoot.zip
      - name: Publish latest dev build
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run that finishes after a newer push mustn't replace the newer build.
          git fetch -q origin dev
          if git log --format=%s "$GITHUB_SHA..origin/dev" | grep -vqx "Update UI snapshots"; then
            echo "dev has moved on since this run started; leaving the newer build in place"
            exit 0
          fi
          git tag -f latest-dev "$GITHUB_SHA"
          git push -f origin refs/tags/latest-dev
          notes="Newest build of the dev branch, from commit ${GITHUB_SHA::7}. Replaced on every push."
          if gh release view latest-dev >/dev/null 2>&1; then
            gh release edit latest-dev --notes "$notes"
          else
            gh release create latest-dev --prerelease --title "Latest dev build" --notes "$notes"
          fi
          gh release upload latest-dev build/TenFoot.zip --clobber

      - name: Render UI snapshots
        if: ${{ steps.visual.outputs.run == 'true' }}
        run: |
          mkdir -p snapshots
          build/TenFoot.app/Contents/MacOS/TenFoot --render-snapshots "$PWD/snapshots" &
          pid=$!
          for _ in $(seq 1 240); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::Snapshot run did not exit in time"
            kill "$pid" || true
          fi
          ls -la snapshots

      - name: Build animation GIF
        if: ${{ steps.visual.outputs.run == 'true' }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow==11.3.0
          mkdir -p docs/snapshots
          .venv/bin/python scripts/make-gif.py snapshots/slide docs/snapshots/home-slide.gif || echo "::warning::No slide GIF"
          .venv/bin/python scripts/make-gif.py snapshots/drag docs/snapshots/home-drag.gif || echo "::warning::No drag GIF"
          .venv/bin/python scripts/make-gif.py snapshots/prompt docs/snapshots/close-prompt.gif || echo "::warning::No prompt GIF"

      - name: Upload snapshots
        if: ${{ always() && (steps.visual.outputs.run == 'true') }}
        uses: actions/upload-artifact@v5
        with:
          name: ui-snapshots
          path: snapshots/

      # Commit the screenshots back to the branch so they can be viewed from a git checkout.
      # Pushes made with GITHUB_TOKEN don't trigger new workflow runs.
      - name: Commit snapshots to branch
        if: ${{ github.ref_type == 'branch' && steps.visual.outputs.run == 'true' }}
        run: |
          mkdir -p docs/snapshots
          for png in snapshots/*.png; do
            case "$png" in *-viewcache.png) continue ;; esac
            name="$(basename "$png" .png)"
            sips --resampleWidth 1920 -s format jpeg -s formatOptions 85 "$png" --out "docs/snapshots/$name.jpg" >/dev/null
          done
          # A newer push has its own run, whose screenshots replace these.
          git fetch origin "${{ github.ref_name }}"
          if git log --format=%s "$GITHUB_SHA..origin/${{ github.ref_name }}" | grep -vqx "Update UI snapshots"; then
            echo "Branch has newer commits; leaving the screenshots to their run"
            exit 0
          fi
          git add docs/snapshots
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update UI snapshots"
          git fetch origin "${{ github.ref_name }}"
          # Only screenshots can conflict here (an older run's); these are newer, so they win.
          if git rebase -X theirs "origin/${{ github.ref_name }}"; then
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "::warning::Branch moved on; snapshots not committed"
          fi
